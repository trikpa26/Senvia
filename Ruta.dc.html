</div>

<dc-import name="Podnozje" hint-size="100%,300px"></dc-import>

      ctaSub: 'Lade die Senvia App kostenlos herunter und melde dich bei einem Fahrer auf deiner Strecke.',
      alsoTitle: 'Menschen senden auch',
      relTpl: 'Paket senden {pair}',
      fDist: 'Entfernung', fDistHint: 'Straßenentfernung {pair}.',
      fDur: 'Fahrtdauer', fDurHint: 'So lange dauert die Fahrt, das Paket reist mit dem Fahrer mit.',
      fPrice: 'Durchschnittlich vereinbarter Preis', fPriceHint: 'Die Spanne auf dieser Strecke reicht von {min} bis {max} Euro.',
      fRides: 'Fahrten in 30 Tagen eingestellt', fRidesHint: 'Zahl der Fahrten, die Nutzer auf dieser Strecke eingestellt haben.',
      fSame: 'Zustellung am selben Tag', fSameHint: 'Klassische Zustellung braucht auf diesem Korridor drei bis vier Werktage.',
      hours: 'h', hoursWord: 'bis', drive: 'h Fahrt', activeRoute: 'Aktive Strecke', avg: 'im Schnitt',
      locale: 'de_DE'
    }
  };

  t() { return { ...this.STR.hr, ...(this.STR[this.state.lang] || {}) }; }
  fill(tpl, vals) { return String(tpl).replace(/\{(\w+)\}/g, (_, k) => vals[k]); }
  // Nazivi gradova po jeziku; njemački zadržava izvorne oblike (Wien, München).
  CITY_DE = { 'Beč': 'Wien', 'Varaždin': 'Varazdin' };
  cityName(hr, en) {
    const lang = this.state.lang;
    if (lang === 'de') return this.CITY_DE[hr] || hr;
    if (lang === 'en') return en || hr;
    return hr;
  }
  pairOf(r) {
    return this.cityName(r.from, r.fromEn) + '\u2013' + this.cityName(r.to, r.toEn);
  }

  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18n = m;
      this.setState({ lang: m.getLang() });
      this.off = m.onLang(l => this.setState({ lang: l }));
    });
    this.applyMeta();
  }
  componentDidUpdate() { this.applyMeta(); }
  componentWillUnmount() { if (this.off) this.off(); }

  applyMeta() {
    const r = this.route();
    const t = this.t();
    const head = document.head;
    document.documentElement.setAttribute('lang', this.state.lang);
    let m = document.querySelector('meta[name="description"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute('name', 'description'); head.appendChild(m); }
    let rb = document.querySelector('meta[name="robots"]');
    if (!rb) { rb = document.createElement('meta'); rb.setAttribute('name', 'robots'); head.appendChild(rb); }
    if (!r) {
      document.title = t.nfTitleTag;
      m.setAttribute('content', t.nfDesc);
      rb.setAttribute('content', 'noindex, follow');
      return;
    }
    const pair = this.pairOf(r);
    const pageTitle = this.fill(t.titleTpl, { pair });
    document.title = pageTitle;
    const desc = this.fill(t.descTpl, { pair });
    m.setAttribute('content', desc);
    if (this.titleTimer) clearTimeout(this.titleTimer);
    this.titleTimer = setTimeout(() => { if (document.title !== pageTitle) document.title = pageTitle; }, 80);
    const setOg = (p, v) => { let el = document.querySelector('meta[property="' + p + '"]'); if (!el) { el = document.createElement('meta'); el.setAttribute('property', p); head.appendChild(el); } el.setAttribute('content', v); };
    setOg('og:title', pageTitle);
    setOg('og:description', desc);
    const routeUrl = 'https://www.senviaapp.com/slanje-paketa/' + r.slug;
    setOg('og:url', routeUrl);
    setOg('og:type', 'website');
    setOg('og:site_name', 'Senvia');
    setOg('og:locale', t.locale);
    setOg('og:image', 'https://www.senviaapp.com/uploads/1024x1024bb.png');
    const setTw = (n, v) => { let el = document.querySelector('meta[name="' + n + '"]'); if (!el) { el = document.createElement('meta'); el.setAttribute('name', n); head.appendChild(el); } el.setAttribute('content', v); };
    setTw('twitter:card', 'summary_large_image');
    setTw('twitter:title', pageTitle);
    setTw('twitter:description', desc);
    setTw('twitter:image', 'https://www.senviaapp.com/uploads/1024x1024bb.png');
    rb.setAttribute('content', 'index, follow');
    const setLink = (rel, href, type) => {
      let el = head.querySelector('link[rel="' + rel + '"]');
      if (!el) { el = document.createElement('link'); el.setAttribute('rel', rel); if (type) el.setAttribute('type', type); head.appendChild(el); }
      el.setAttribute('href', href);
    };
    setLink('canonical', routeUrl);
    setLink('sitemap', '/sitemap.xml', 'application/xml');
    let bc = document.getElementById('senvia-breadcrumb-ld');
    if (!bc) { bc = document.createElement('script'); bc.type = 'application/ld+json'; bc.id = 'senvia-breadcrumb-ld'; head.appendChild(bc); }
    bc.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Senvia', item: 'https://www.senviaapp.com/' },
        { '@type': 'ListItem', position: 2, name: t.crumbSend, item: 'https://www.senviaapp.com/slanje-paketa' },
        { '@type': 'ListItem', position: 3, name: pair, item: routeUrl }
      ]
    });
    const stale = document.getElementById('senvia-route-ld');
    if (stale) stale.remove();
  }

  route() {
    const slug = this.props.slug;
    return this.active().find(r => r.slug === slug) || null;
  }


  renderVals() {
    const t = this.t();
    const r = this.route();
    if (!r) return { found: false, notFound: true, facts: [], related: [], nfTitle: t.nfTitle, nfText: t.nfText, nfLink: t.nfLink, crumbSend: t.crumbSend, alsoTitle: t.alsoTitle };

    const pair = this.pairOf(r);
    const facts = [];
    if (r.distanceKm) facts.push({ value: r.distanceKm + ' km', label: t.fDist, hint: this.fill(t.fDistHint, { pair }) });
    if (r.durationHours) facts.push({ value: r.durationHours[0] + ' ' + t.hoursWord + ' ' + r.durationHours[1] + ' ' + t.hours, label: t.fDur, hint: t.fDurHint });
    if (r.priceMin && r.priceMax) facts.push({ value: Math.round((r.priceMin + r.priceMax) / 2) + ' €', label: t.fPrice, hint: this.fill(t.fPriceHint, { min: r.priceMin, max: r.priceMax }) });
    if (r.ridesLast30) facts.push({ value: String(r.ridesLast30), label: t.fRides, hint: t.fRidesHint });
    if (r.sameDayShare) facts.push({ value: r.sameDayShare + ' %', label: t.fSame, hint: t.fSameHint });

    const related = this.active()
      .filter(x => x.slug !== r.slug)
      .sort((a, b) => b.activeDrivers - a.activeDrivers)
      .slice(0, 3)
      .map(x => ({
        href: 'Ruta%20-%20' + x.slug + '.dc.html',
        title: this.fill(t.relTpl, { pair: this.pairOf(x) }),
        meta: (x.durationHours ? x.durationHours[0] + ' ' + t.hoursWord + ' ' + x.durationHours[1] + ' ' + t.drive : t.activeRoute) + (x.priceMin ? ' \u00b7 ' + t.avg + ' ' + Math.round((x.priceMin + x.priceMax) / 2) + ' €' : '')
      }));

    return {
      found: true, notFound: false, pair, facts, related,
      hasFacts: facts.length > 0,
      crumbSend: t.crumbSend, alsoTitle: t.alsoTitle,
      nfTitle: t.nfTitle, nfText: t.nfText, nfLink: t.nfLink,
      h1: this.fill(t.h1Tpl, { pair }),
      factsTitle: this.fill(t.factsTitleTpl, { pair }),
      factsNote: t.factsNote,
      intro: this.fill(t.introTpl, { pair }),
      intro2: t.intro2,
      ctaTitle: this.fill(t.ctaTitleTpl, { pair }),
      ctaSub: t.ctaSub
    };
  }
}
</script>
</body>
</html>
