  POSTS = [
    { href: 'Blog%20-%20Zasto%20postoji%20Senvia.dc.html', lang: 'hr',

      desc: { hr: 'Auti i kombiji svaki dan voze poluprazni. Kako vozači dijele troškove puta, a stvari putuju odmah.', en: 'Cars and vans drive half empty every day. How drivers share trip costs and items travel right away.', de: 'Autos und Transporter fahren jeden Tag halb leer. Wie Fahrer Fahrtkosten teilen und Sachen sofort reisen.' } },
    { href: 'Blog%20-%20Slanje%20namjestaja.dc.html', lang: 'hr',

    { href: 'Blog%20-%20Podijeli%20troskove%20voznje.dc.html', lang: 'hr',
      tag: { hr: 'Putnici', en: 'Travellers', de: 'Reisende' },
      title: { hr: 'Kako podijeliti troškove vožnje koju ionako imaš', en: 'How to share the cost of a drive you are making anyway', de: 'Fahrtkosten teilen auf einer Fahrt, die du ohnehin machst' },
      desc: { hr: 'Ako redovito voziš istim smjerom, prazno mjesto u prtljažniku može pokriti dio puta.', en: 'If you drive the same way regularly, the empty space in your boot can cover part of the trip.', de: 'Fährst du regelmäßig dieselbe Strecke, kann der freie Platz im Kofferraum einen Teil der Fahrt decken.' } },
    { href: 'Blog%20-%20Slanje%20iz%20Svicarske.dc.html', lang: 'hr',
      tag: { hr: 'Švicarska', en: 'Switzerland', de: 'Schweiz' },
      title: { hr: 'Slanje stvari iz Švicarske u Hrvatsku', en: 'Sending items from Switzerland to Croatia', de: 'Sachen aus der Schweiz nach Kroatien schicken' },
      desc: { hr: 'Hrvatska zajednica u Švicarskoj redovito putuje kući, a vožnje iz Züricha, Basela, Berna i St.', en: 'The Croatian community in Switzerland travels home regularly, and drives from Zurich, Basel, Bern and St.', de: 'Die kroatische Gemeinschaft in der Schweiz fährt regelmäßig nach Hause, und Fahrten aus Zürich, Basel, Bern und St.' } },
    { href: 'Blog%20-%20Slanje%20unutar%20Hrvatske.dc.html', lang: 'hr',
      tag: { hr: 'Hrvatska', en: 'Croatia', de: 'Kroatien' },
      title: { hr: 'Slanje stvari unutar Hrvatske: Zagreb, obala i sve između', en: 'Sending items inside Croatia: Zagreb, the coast and everything between', de: 'Sachen innerhalb Kroatiens senden: Zagreb, Küste und alles dazwischen' },
      desc: { hr: 'Studenti, sezonski radnici i svi koji rade izvan svog grada, s naknadama po rutama.', en: 'Students, seasonal workers and everyone working away from home, with fees per route.', de: 'Studierende, Saisonarbeiter und alle, die auswärts arbeiten, mit Kostenbeiträgen je Strecke.' } },
    { href: 'Blog%20-%20Dijaspora%20stvari%20doma.dc.html', lang: 'hr',
      tag: { hr: 'Dijaspora', en: 'Diaspora', de: 'Diaspora' },
      title: { hr: 'Kako stvari dolaze doma: Njemačka, Švicarska, Irska i Austrija', en: 'How items get home: Germany, Switzerland, Ireland and Austria', de: 'Wie Sachen nach Hause kommen: Deutschland, Schweiz, Irland und Österreich' },
      desc: { hr: 'Što se šalje u obje strane, koliko traje put i kako pripremiti stvari za dugu vožnju.', en: 'What travels in both directions, how long it takes and how to prepare items for a long drive.', de: 'Was in beide Richtungen reist, wie lange es dauert und wie man Sachen für lange Fahrten vorbereitet.' } },
    { href: 'Blog%20-%20Kako%20poslati%20stvari%20u%20Austriju.dc.html', lang: 'hr',
      tag: { hr: 'Vodič', en: 'Guide', de: 'Ratgeber' },
      title: { hr: 'Kako poslati stvari u Austriju? Vodič za 2026.', en: 'How to send items to Austria? A 2026 guide', de: 'Wie schickt man Sachen nach Österreich? Ratgeber 2026' },
      desc: { hr: 'Tri načina slanja, okvirne naknade, trajanje i savjeti da stvari brže nađu putnika.', en: 'Three ways to send, indicative fees, timings and tips so items find a traveller faster.', de: 'Drei Versandwege, Richtwerte, Dauer und Tipps, damit Sachen schneller einen Reisenden findet.' } },
    { href: 'Blog%20-%20Sachen%20nach%20Kroatien%20schicken.dc.html', lang: 'de',
      tag: { hr: 'Deutsch', en: 'Deutsch', de: 'Deutsch' },
      title: { hr: 'Sachen nach Kroatien schicken, Ratgeber 2026', en: 'Sachen nach Kroatien schicken, Ratgeber 2026', de: 'Sachen nach Kroatien schicken, Ratgeber 2026' },
      desc: { hr: 'Kosten, Dauer und Strecken aus Österreich, Deutschland und der Schweiz.', en: 'Kosten, Dauer und Strecken aus Österreich, Deutschland und der Schweiz.', de: 'Kosten, Dauer und Strecken aus Österreich, Deutschland und der Schweiz.' } },
    { href: 'Blog%20-%20Kome%20koriste%20rute.dc.html', lang: 'hr',
      tag: { hr: 'Korisnici', en: 'Users', de: 'Nutzer' },
      title: { hr: 'Kome najviše koriste rute za slanje stvari', en: 'Who benefits most from these routes', de: 'Wem die Strecken am meisten nützen' },
      desc: { hr: 'Dijaspora, studenti, sezonski radnici i ljudi koji rade izvan svojega grada.', en: 'The diaspora, students, seasonal workers and people working away from home.', de: 'Diaspora, Studierende, Saisonarbeiter und Menschen, die auswärts arbeiten.' } },
    { href: 'Blog%20-%20Sto%20Hrvati%20u%20Becu%20salju%20doma.dc.html', lang: 'hr',
      tag: { hr: 'Iskustva', en: 'Stories', de: 'Erfahrungen' },
      title: { hr: 'Što dijaspora u Austriji šalje kući u Hrvatsku', en: 'What the diaspora in Austria sends home to Croatia', de: 'Was die Diaspora in Österreich nach Kroatien schickt' },
      desc: { hr: 'Beč, Graz, Linz i Salzburg prema Hrvatskoj, što ide u obratnom smjeru i kako to zapakirati.', en: 'Vienna, Graz, Linz and Salzburg towards Croatia, what goes the other way and how to pack it.', de: 'Wien, Graz, Linz und Salzburg Richtung Kroatien, was zurückreist und wie man es verpackt.' } },
    { href: 'Blog%20-%20Koliko%20kosta%20slanje%20stvari.dc.html', lang: 'hr',
      tag: { hr: 'Naknade', en: 'Fees', de: 'Kostenbeiträge' },

      desc: { hr: 'Usporedba tarife klasične dostave i dogovora s putnikom, na primjeru rute Beč–Zagreb.', en: 'Classic delivery tariffs compared with a traveller agreement, on the Vienna to Zagreb route.', de: 'Tarife der klassischen Zustellung im Vergleich zur Absprache mit einem Reisenden, Strecke Wien nach Zagreb.' } }
  ];

  componentWillUnmount() { if (this.off) this.off(); }

  t() { return { ...this.STR.hr, ...(this.STR[this.state.lang] || {}) }; }

  syncSeo() {
    const lang = this.state.lang;
    const t = this.t();
    if (this.seoLang !== lang) {
      this.seoLang = lang;
      document.documentElement.setAttribute('lang', lang);
      const meta = (attr, name, content) => {
        let el = document.head.querySelector('meta[' + attr + '="' + name + '"]');
        if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
        el.setAttribute('content', content);
      };
      meta('name', 'description', t.desc);
      meta('property', 'og:title', t.title);
      meta('property', 'og:description', t.desc);
      meta('property', 'og:locale', t.locale);
      const bl = document.getElementById('senvia-blog-ld');
      if (bl) bl.textContent = JSON.stringify({
        '@context': 'https://schema.org', '@type': 'Blog',
        name: 'Senvia blog', url: 'https://www.senviaapp.com/blog/', inLanguage: lang,
        publisher: { '@type': 'Organization', name: 'Senvia', url: 'https://www.senviaapp.com/' }
      });
    }
    if (this.titleTimer) clearTimeout(this.titleTimer);
    this.titleTimer = setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 60);
    setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 400);
  }

  renderVals() {
    this.syncSeo();
    const lang = this.state.lang;
    const pick = (o) => o[lang] || o.hr;
    return {
      t: this.t(),
      posts: this.POSTS.filter(p => p.lang !== 'de' || lang === 'de').map(p => ({ href: p.href, lang: p.lang, tag: pick(p.tag), title: pick(p.title), desc: pick(p.desc) }))
    };
  }

  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18n = m;
      this.setState({ lang: m.getLang() });
      this.off = m.onLang(l => this.setState({ lang: l }));
    });
    const add = (id, data) => {
      let el = document.getElementById(id);
      if (!el) { el = document.createElement('script'); el.type = 'application/ld+json'; el.id = id; document.head.appendChild(el); }
      el.textContent = JSON.stringify(data);
    };
    add('senvia-breadcrumb-ld', {
      '@context': 'https://schema.org', '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Početna', item: 'https://www.senviaapp.com/' },
        { '@type': 'ListItem', position: 2, name: 'Blog', item: 'https://www.senviaapp.com/blog/' }
      ]
    });
    add('senvia-blog-ld', {
      '@context': 'https://schema.org', '@type': 'Blog',
      name: 'Senvia blog', url: 'https://www.senviaapp.com/blog/', inLanguage: 'hr',
      publisher: { '@type': 'Organization', name: 'Senvia', url: 'https://www.senviaapp.com/' }
    });
  }
}
</script>
