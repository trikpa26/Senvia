<script type="text/x-dc" data-dc-script data-props="{&quot;defaultLang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;hr&quot;, &quot;en&quot;, &quot;de&quot;], &quot;default&quot;: &quot;hr&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Jezik&quot;}}">
class Component extends DCLogic {
  state = { lang: null };

  STR = {
    hr: {
      back: 'Natrag na stranicu', kicker: 'Tvoj račun', title: 'Brisanje računa',
      intro: 'Žao nam je što odlaziš. Svoj Senvia račun i sve povezane podatke možeš trajno izbrisati izravno u aplikaciji, u nekoliko koraka.',
      inAppTitle: 'Brisanje u aplikaciji',
      step1: 'Otvori aplikaciju Senvia i prijavi se na svoj račun.',
      step2: 'Otvori Profil, a zatim Postavke.',
      step3: 'Odaberi Izbriši račun i potvrdi brisanje.',
      warning: 'Brisanje je trajno i ne može se poništiti. Uklanjaju se tvoj profil, pošiljke, poruke i ocjene.',
      noAccessTitle: 'Nemaš pristup aplikaciji?',
      noAccessDesc: 'Pošalji nam zahtjev za brisanje s e-mail adrese povezane s tvojim računom i obradit ćemo ga u najkraćem roku.',
      rights: 'Sva prava pridržana.'
    },
    en: {
      back: 'Back to site', kicker: 'Your account', title: 'Account deletion',
      intro: 'Sorry to see you go. You can permanently delete your Senvia account and all associated data directly in the app, in a few steps.',
      inAppTitle: 'Delete in the app',
      step1: 'Open the Senvia app and sign in to your account.',
      step2: 'Go to Profile, then Settings.',
      step3: 'Choose Delete account and confirm.',
      warning: 'Deletion is permanent and cannot be undone. Your profile, shipments, messages and ratings will be removed.',
      noAccessTitle: 'Can’t access the app?',
      noAccessDesc: 'Send us a deletion request from the email address linked to your account and we will process it as soon as possible.',
      rights: 'All rights reserved.'
    },
    de: {
      back: 'Zurück zur Seite', kicker: 'Dein Konto', title: 'Konto löschen',
      intro: 'Schade, dass du gehst. Dein Senvia Konto und alle damit verbundenen Daten kannst du in wenigen Schritten direkt in der App dauerhaft löschen.',
      inAppTitle: 'Löschen in der App',
      step1: 'Öffne die Senvia App und melde dich bei deinem Konto an.',
      step2: 'Gehe zu Profil und danach zu Einstellungen.',
      step3: 'Wähle Konto löschen und bestätige die Löschung.',
      warning: 'Die Löschung ist endgültig und kann nicht rückgängig gemacht werden. Profil, Sendungen, Nachrichten und Bewertungen werden entfernt.',
      noAccessTitle: 'Kein Zugriff auf die App?',
      noAccessDesc: 'Schicke uns die Löschanfrage von der E-Mail-Adresse, die mit deinem Konto verknüpft ist, wir bearbeiten sie so schnell wie möglich.',
      rights: 'Alle Rechte vorbehalten.'
    }
  };


  addBreadcrumbLd() {
    let bc = document.getElementById('senvia-breadcrumb-ld');
    if (!bc) { bc = document.createElement('script'); bc.type = 'application/ld+json'; bc.id = 'senvia-breadcrumb-ld'; document.head.appendChild(bc); }
    bc.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'BreadcrumbList',
      itemListElement: [{"@type":"ListItem","position":1,"name":"Senvia","item":"https://www.senviaapp.com/"},{"@type":"ListItem","position":2,"name":"Brisanje računa","item":"https://www.senviaapp.com/brisanje-racuna/"}]
    });
  }
  componentDidMount() {
    this.addBreadcrumbLd();
    import('./i18n.js').then(m => {
      this.i18n = m;
      this.setState({ lang: m.getLang() });
      this.off = m.onLang(l => this.setState({ lang: l }));
    });
  }
  componentWillUnmount() { if (this.off) this.off(); }

  getLang() { return this.state.lang || (this.props.defaultLang ?? 'hr'); }
  setLang(l) { if (this.i18n) this.i18n.setLang(l); else this.setState({ lang: l }); }

  renderVals() {
    const lang = this.getLang();
    const t = { ...this.STR.hr, ...(this.STR[lang] || {}) };
    const pill = { border: 'none', cursor: 'pointer', fontFamily: "'Instrument Sans', sans-serif", fontWeight: 700, fontSize: '13px', padding: '5px 12px', borderRadius: '999px', transition: 'all .2s' };
    return {
      t,
      setHr: () => this.setLang('hr'), setEn: () => this.setLang('en'),
      hrBtnStyle: { ...pill, background: lang === 'hr' ? '#12261a' : 'transparent', color: lang === 'hr' ? '#ffffff' : '#3c5346' },
      enBtnStyle: { ...pill, background: lang === 'en' ? '#12261a' : 'transparent', color: lang === 'en' ? '#ffffff' : '#3c5346' }
    };
  }
}
</script>
