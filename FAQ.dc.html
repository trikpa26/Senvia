      { title: 'General', items: [
        { q: 'What is Senvia?', a: 'Senvia is an app that connects people sending items with travellers already going the same way. Instead of classic delivery, the items ride along on a journey that is happening anyway, and the whole arrangement takes place in the app.' },
        { q: 'Is Senvia free?', a: 'Yes, the app is free to download and use, with no subscription and no monthly fee. You only pay for the booking once you find a traveller and confirm the items.' },
        { q: 'Where does Senvia currently work?', a: 'The busiest routes are in Croatia and Austria, with regular trips towards Germany and Bosnia and Herzegovina. You are not limited to certain cities: you can post a request wherever you are, and a route page exists as long as there are active travellers on it.' },
        { q: 'Which platforms is the app available on?', a: 'Senvia is available for iPhone on the App Store and for Android on Google Play. You can browse the app as a guest before registering.' },
        { q: 'Who is Senvia for?', a: 'For anyone sending items. It is used most by the Croatian diaspora in Austria, Germany and Switzerland, students studying away from home, seasonal workers on the coast and people working outside the town they live in.' },
        { q: 'Is Senvia a delivery company?', a: 'No. Senvia does not carry items and has no fleet or warehouses. The app connects a sender with a traveller already going that way, and the transport is an agreement between the two of them.' },
        { q: 'Which languages is the app in?', a: 'The app is available in Croatian and English, and the website in Croatian, English and German.' },
        { q: 'Do I have to register to browse?', a: 'No. You can browse posted rides and requests as a guest. Registration is needed only when you want to post a request, post a ride or send a message.' }
      ] },
      { title: 'Sending items', items: [
        { q: 'What can I send?', a: 'Anything legal to transport, from an envelope to furniture: documents, clothes, electronics, sports gear, suitcases, bikes, appliances and furniture. For large items, travellers with a van or trailer reply. You agree dimensions, weight and the hand-over with the traveller before the transport is accepted.' },
        { q: 'What does sending items cost?', a: 'The sender sets the fee when posting a request, within the minimum and maximum range Senvia suggests. For smaller items on shorter routes it is usually between 5 and 20 euros, and the amount shown in the app is the one that applies.' },
        { q: 'What does sending items to Austria cost?', a: 'On routes between Croatia and Austria it is usually between 10 and 25 euros, depending on the size of the items and the length of the route. That is well below international tariffs of classic delivery, where the same items usually costs 20 to 45 euros.' },
        { q: 'How do I track where my items are?', a: 'Through the chat with the traveller, which stays open for the whole journey. The traveller reports departure and arrival, so you always know which stage the delivery is at.' },
        { q: 'What if the items are late or go missing?', a: 'Message the traveller in the chat first, as most delays are sorted out in a few messages. If the problem persists, write to contact@senviaapp.com and we will help with communication between the two sides. This is why photographing the items at hand-over and describing the contents upfront matters.' },
        { q: 'Can I send several items at once?', a: 'Yes, if the traveller has enough room. Describe all items in the request and give the total dimensions, so the traveller can judge whether everything fits in the vehicle.' },
        { q: 'How long does delivery take?', a: 'As long as the drive itself. Vienna and Zagreb are four to five hours apart, Graz and Zagreb two to three, so the items arrive in hours rather than days. Classic delivery on the same corridors takes three to four working days.' },
        { q: 'How do I send items to Austria fastest?', a: 'Post a request with the route, date and a photo, and travellers already going that way get in touch. Sending items to Austria from Zagreb, Varazdin or Rijeka is usually agreed the same day, because those are the busiest routes towards Vienna and Graz.' },
        { q: 'Can I send items to Germany or Switzerland?', a: 'Yes. Routes towards Germany and Switzerland are getting busier, mostly to Munich, Stuttgart, Zurich and Basel. If no ride is posted right now, leave the request active and travellers get in touch when they plan a trip.' },
        { q: 'What am I not allowed to send?', a: 'Weapons, narcotics, flammable and toxic materials, live animals, human remains and biological samples, counterfeit goods and anything whose transport is a criminal offence or a misdemeanour. The full list is on the Sending items page.' },
        { q: 'Do I have to pack the items?', a: 'Yes, in a box or a sturdy bag. Nothing should rattle inside, wrap electronics, and pad glass with clothing or bubble wrap. A traveller may refuse items that are not ready for the road.' },
        { q: 'Do I have to photograph the items?', a: 'The photo goes into the request and shows the traveller what they are carrying. If items are not photographed, the traveller does not have to accept them. Along with the description and the photo, note anything that needs care, for example fragile, perishable or valuable.' },
        { q: 'Can I send homemade food?', a: 'Yes, if it does not need a fridge during the drive. Ajvar, preserves, prosciutto, cheese, honey and cakes travel to the diaspora regularly. Mention anything perishable in the chat before agreeing.' }
      ] },
      { title: 'For travellers and drivers', items: [
        { q: 'How can I share trip costs by carrying items?', a: 'Post a planned ride with the route, date and spare capacity, or browse senders requests on your route. Once you accept a request and deliver the items, the fee is recorded in the app.' },
        { q: 'Do I have to detour from my route?', a: 'No. You agree a hand-over point that suits you, along the route you are taking anyway. If the arrangement does not suit you, you do not have to accept the request.' },
        { q: 'How does payment work?', a: 'Payment goes through the app, with Apple Pay, Google Pay and card payment. The amount is known before the transport, so there is no negotiating on the spot afterwards.' },
        { q: 'Can I decline a request?', a: 'Yes. You decide which items you carry, for whom and at what fee. Before accepting you can review the senders profile and reviews.' },
        { q: 'How much of my trip costs can I cover on one trip?', a: 'It depends on the route and the number of items. On routes between Croatia and Austria the agreement is usually between ten and twenty five euros per item, and you can carry several items on one trip if you have the room.' },
        { q: 'Do I need a permit to carry items?', a: 'For occasional carrying on a trip you are making anyway you do not need a transport licence, because the items travel as personal luggage. Regular commercial transport of goods falls under different rules and Senvia does not cover it.' },
        { q: 'Can I carry items for several senders?', a: 'Yes. You accept as many requests as fit in your vehicle. Every arrangement runs in its own chat, so hand-overs do not get mixed up.' }
      ] },
      { title: 'Routes and countries', items: [
        { q: 'Which routes are busiest right now?', a: 'Most travel happens between Croatia and Austria, above all Vienna, Graz, Linz and Salzburg towards Zagreb, Varazdin, Rijeka and Osijek. Towards Germany the busiest are Munich and Stuttgart, and inside Croatia Zagreb towards Split, Rijeka and Osijek.' },
        { q: 'Does Senvia work inside Croatia?', a: 'Yes. Rides inside Croatia happen daily, mostly between Zagreb, Split, Rijeka, Zadar, Osijek and Varazdin. The items arrive in hours rather than days.' },
        { q: 'What if there is no traveller on my route?', a: 'Leave the request active. Travellers browse requests when they plan a trip, so replies come days later too. A route opens as soon as the first traveller appears.' },
        { q: 'Are items sent to the islands?', a: 'Yes, if the traveller takes a ferry or lives on an island. The delivery time then includes the sailing schedule, so agree that in the chat before confirming.' }
      ] },
      { title: 'Fees and payment', items: [
        { q: 'How is the fee decided?', a: 'The sender proposes the fee when posting a request, within the range the app suggests. The amount depends only on distance and item size (from S to XXL).' },
        { q: 'Does Senvia have hidden fees?', a: 'No. The app is free to download, with no subscription, no per-kilo fee and no charge after delivery. The amount is known before you confirm.' },
        { q: 'When is the transport paid for?', a: 'Payment goes through the app, with Apple Pay, Google Pay or a card, once the sender and the traveller agree. There is no paying on the spot and no negotiating at hand-over.' },
        { q: 'Do I get a refund if the transport is cancelled?', a: 'If the traveller cancels before hand-over, you can find another one or request a refund. Write to contact@senviaapp.com and we will sort it out.' }
      ] },
      { title: 'Safety', items: [
        { q: 'Is it safe to send with Senvia?', a: 'Before agreeing you can review a users profile, their ratings, reviews and activity history. Communication stays inside the app, and after every completed delivery both sides leave a rating and a review.' },
        { q: 'How does user verification work?', a: 'Every new account is approved before the first shipment. The profile also shows the average rating, reviews from other users and the number of completed trips, so you can judge who you are dealing with.' },
        { q: 'What happens if something goes wrong?', a: 'Write to contact@senviaapp.com and we will help with communication between the sender and the traveller. Ratings and reviews stay publicly visible, so a users conduct is visible to others too.' },
        { q: 'Do I have to accept every request or offer?', a: 'No. Nothing is obligatory. If the profile, the contents, the fee or the timing do not suit you, you simply do not confirm. No explanation, no penalty and no effect on your rating.' },
        { q: 'What if the items have no photo?', a: 'You do not have to accept the transport. The photo is how a traveller knows what they are carrying and how a sender has a record of the condition before the trip.' },
        { q: 'Can I report a user?', a: 'You can, through the app or at contact@senviaapp.com. Support is available every day, and ratings and reviews stay public, so conduct is visible before every new arrangement.' },
        { q: 'How is my personal data protected?', a: 'You do not share your phone number or email address with the other side, everything runs through the chat in the app. You can permanently delete your account and all related data in the app at any time.' }
      ] }
    ],
    de: [
      { title: 'Allgemein', items: [
        { q: 'Was ist Senvia?', a: 'Senvia ist eine App, die Absender mit Reisenden verbindet, die ohnehin dieselbe Strecke fahren. Statt klassischer Zustellung reisen die Sachen auf einer Fahrt mit, die sowieso stattfindet, und die gesamte Absprache läuft in der App.' },
        { q: 'Ist Senvia kostenlos?', a: 'Ja, die App ist kostenlos zum Herunterladen und Nutzen, ohne Abo und ohne Monatsgebühr. Bezahlt wird erst die Buchung, sobald du einen Reisenden gefunden und die Sachen bestätigt hast.' },
        { q: 'Wo funktioniert Senvia derzeit?', a: 'Am aktivsten sind die Strecken in Kroatien und Österreich, dazu regelmäßige Fahrten nach Deutschland sowie nach Bosnien und Herzegowina. Du bist nicht auf bestimmte Städte beschränkt: Eine Anfrage kannst du überall stellen, und eine Streckenseite existiert, solange es dort aktive Reisende gibt.' },
        { q: 'Auf welchen Plattformen gibt es die App?', a: 'Senvia gibt es für iPhone im App Store und für Android bei Google Play. Vor der Registrierung kannst du die App als Gast ansehen.' },
        { q: 'Für wen ist Senvia gedacht?', a: 'Für alle, die Sachen senden. Am meisten genutzt wird sie von der kroatischen Diaspora in Österreich, Deutschland und der Schweiz, von Studierenden ausserhalb ihrer Heimatstadt, von Saisonarbeitern an der Küste und von Menschen, die ausserhalb ihres Wohnorts arbeiten.' },
        { q: 'Ist Senvia ein Zustelldienst?', a: 'Nein. Senvia transportiert keine Sachen und hat weder Fuhrpark noch Lager. Die App verbindet Absender und Reisende, die ohnehin in diese Richtung fahren, der Transport ist eine Absprache zwischen den beiden.' },
        { q: 'In welchen Sprachen gibt es die App?', a: 'Die App gibt es auf Kroatisch und Englisch, die Website auf Kroatisch, Englisch und Deutsch.' },
        { q: 'Muss ich mich registrieren, um zu stöbern?', a: 'Nein. Veröffentlichte Fahrten und Anfragen kannst du als Gast ansehen. Eine Registrierung brauchst du erst, wenn du eine Anfrage oder Fahrt einstellen oder eine Nachricht schreiben willst.' }
      ] },
      { title: 'Sachen senden', items: [
        { q: 'Was kann ich senden?', a: 'Alles, was legal zu transportieren ist, vom Umschlag bis zum Möbelstück: Dokumente, Kleidung, Elektronik, Sportausrüstung, Koffer, Fahrräder, Haushaltsgeräte und Möbel. Für große Sachen melden sich Reisende mit Transporter oder Anhänger. Maße, Gewicht und Übergabe vereinbarst du vor der Zusage direkt mit dem Reisenden.' },
        { q: 'Was kostet der Versand von Sachen?', a: 'Den Kostenbeitrag legt der Absender bei der Anfrage fest, innerhalb der Spanne, die Senvia vorschlägt. Für kleinere Sachen auf kürzeren Strecken liegt er meist zwischen 5 und 20 Euro, und es gilt der Betrag, der in der App steht.' },
        { q: 'Was kostet der Versand von Sachen nach Österreich?', a: 'Auf Strecken zwischen Kroatien und Österreich liegt der Betrag meist zwischen 10 und 25 Euro, je nach Größe der Sachen und Streckenlänge. Das ist deutlich weniger als die internationalen Tarife der klassischen Zustellung, wo dieselben Sachen meist 20 bis 45 Euro kostet.' },
        { q: 'Wie verfolge ich meine Sachen?', a: 'Über den Chat mit dem Reisenden, der während der gesamten Fahrt offen bleibt. Der Reisende meldet Abfahrt und Ankunft, du weisst also jederzeit, in welcher Phase die Zustellung ist.' },
        { q: 'Was, wenn die Sachen zu spät kommen oder verloren gehen?', a: 'Schreib zuerst dem Reisenden im Chat, die meisten Verzögerungen klären sich in wenigen Nachrichten. Bleibt das Problem, schreib an contact@senviaapp.com, wir helfen bei der Kommunikation zwischen beiden Seiten. Deshalb ist es wichtig, die Sachen bei der Übergabe zu fotografieren und den Inhalt vorab zu beschreiben.' },
        { q: 'Kann ich mehrere Sachen gleichzeitig senden?', a: 'Ja, wenn der Reisende genug Platz hat. Beschreibe alle Sachen in der Anfrage und gib die Gesamtmaße an, damit der Reisende einschätzen kann, ob alles ins Fahrzeug passt.' },
        { q: 'Wie lange dauert die Zustellung?', a: 'So lange wie die Fahrt selbst. Wien und Zagreb trennen vier bis fünf Stunden, Graz und Zagreb zwei bis drei, die Sachen kommen also in Stunden statt Tagen an. Die klassische Zustellung braucht auf denselben Strecken drei bis vier Werktage.' },
        { q: 'Wie schicke ich Sachen am schnellsten nach Österreich?', a: 'Stelle eine Anfrage mit Strecke, Datum und Foto ein, dann melden sich Reisende, die ohnehin dorthin fahren. Sachen nach Österreich aus Zagreb, Varazdin oder Rijeka werden meist am selben Tag vereinbart, denn das sind die aktivsten Strecken Richtung Wien und Graz.' },
        { q: 'Kann ich Sachen nach Deutschland oder in die Schweiz senden?', a: 'Ja. Strecken nach Deutschland und in die Schweiz werden immer aktiver, vor allem nach München, Stuttgart, Zürich und Basel. Ist gerade keine Fahrt eingestellt, lass die Anfrage aktiv, Reisende melden sich, sobald sie eine Fahrt planen.' },
        { q: 'Was darf ich nicht senden?', a: 'Waffen, Betäubungsmittel, entflammbare und giftige Stoffe, lebende Tiere, menschliche Überreste und biologische Proben, gefälschte Waren sowie alles, dessen Transport eine Straftat oder ein Vergehen darstellt. Die vollständige Liste steht auf der Seite Sachen senden.' },
        { q: 'Muss ich die Sachen verpacken?', a: 'Ja, in einen Karton oder eine feste Tasche. Nichts darf im Inneren klappern, Elektronik einwickeln, Glas mit Kleidung oder Folie polstern. Ein Reisender darf Sachen ablehnen, die nicht transportbereit sind.' },
        { q: 'Muss ich die Sachen fotografieren?', a: 'Das Foto gehört in die Anfrage und zeigt dem Reisenden, was er transportiert. Sind Sachen nicht fotografiert, muss der Reisende den Transport nicht annehmen. Notiere zur Beschreibung und zum Foto auch, wenn etwas Aufmerksamkeit braucht, etwa zerbrechlich, verderblich oder wertvoll.' },
        { q: 'Kann ich hausgemachte Lebensmittel senden?', a: 'Ja, wenn sie während der Fahrt keinen Kühlschrank brauchen. Ajvar, Eingemachtes, Prosciutto, Käse, Honig und Kuchen reisen regelmäßig zur Diaspora. Verderbliches kündige vor der Zusage im Chat an.' }
      ] },
      { title: 'Für Reisende und Fahrer', items: [
        { q: 'Wie kann ich mit Sachen Fahrtkosten teilen?', a: 'Stelle deine geplante Fahrt mit Strecke, Datum und freier Kapazität ein oder sieh dir Anfragen auf deiner Strecke an. Nimmst du eine Anfrage an und lieferst die Sachen, wird der Kostenbeitrag in der App erfasst.' },
        { q: 'Muss ich von meiner Strecke abweichen?', a: 'Nein. Den Übergabeort vereinbarst du so, wie es dir passt, entlang der Strecke, die du ohnehin fährst. Passt die Absprache nicht, musst du die Anfrage nicht annehmen.' },
        { q: 'Wie läuft die Zahlung ab?', a: 'Die Zahlung läuft in der App, mit Apple Pay, Google Pay und Kartenzahlung. Der Betrag steht vor dem Transport fest, es wird vor Ort nicht nachverhandelt.' },
        { q: 'Kann ich eine Anfrage ablehnen?', a: 'Ja. Du entscheidest, welche Sachen du mitnimmst, für wen und zu welchem Kostenbeitrag. Vor der Zusage kannst du Profil und Bewertungen des Absenders ansehen.' },
        { q: 'Welchen Teil der Fahrtkosten kann ich auf einer Fahrt decken?', a: 'Das hängt von Strecke und Anzahl der Sachen ab. Auf Strecken zwischen Kroatien und Österreich liegt die Absprache meist bei zehn bis fünfundzwanzig Euro pro Sendung, und auf einer Fahrt kannst du mehrere Sachen mitnehmen, wenn du Platz hast.' },
        { q: 'Brauche ich eine Genehmigung für den Transport von Sachen?', a: 'Für gelegentlichen Transport auf einer Fahrt, die du ohnehin machst, brauchst du keine Transportlizenz, denn die Sachen reisen als persönliches Gepäck. Regelmäßiger gewerblicher Warentransport unterliegt anderen Regeln, den deckt Senvia nicht ab.' },
        { q: 'Kann ich Sachen mehrerer Absender mitnehmen?', a: 'Ja. Du nimmst so viele Anfragen an, wie in dein Fahrzeug passen. Jede Absprache läuft in einem eigenen Chat, so vermischen sich die Übergaben nicht.' }
      ] },
      { title: 'Strecken und Länder', items: [
        { q: 'Welche Strecken sind derzeit am aktivsten?', a: 'Am meisten wird zwischen Kroatien und Österreich gefahren, vor allem Wien, Graz, Linz und Salzburg Richtung Zagreb, Varazdin, Rijeka und Osijek. Nach Deutschland sind München und Stuttgart am aktivsten, innerhalb Kroatiens Zagreb Richtung Split, Rijeka und Osijek.' },
        { q: 'Funktioniert Senvia innerhalb Kroatiens?', a: 'Ja. Fahrten innerhalb Kroatiens gibt es täglich, vor allem zwischen Zagreb, Split, Rijeka, Zadar, Osijek und Varazdin. Die Sachen kommen in Stunden statt Tagen an.' },
        { q: 'Was, wenn es auf meiner Strecke keinen Reisenden gibt?', a: 'Lass die Anfrage aktiv. Reisende sehen sich Anfragen an, wenn sie eine Fahrt planen, Antworten kommen also auch Tage später. Eine Strecke öffnet sich, sobald der erste Reisende auftaucht.' },
        { q: 'Werden Sachen auf die Inseln geschickt?', a: 'Ja, wenn der Reisende eine Fähre nimmt oder auf einer Insel lebt. Die Zustellzeit umfasst dann auch den Fährplan, vereinbart das vor der Bestätigung im Chat.' }
      ] },
      { title: 'Kostenbeiträge und Zahlung', items: [
        { q: 'Wie wird der Kostenbeitrag festgelegt?', a: 'Den Kostenbeitrag schlägt der Absender bei der Anfrage vor, innerhalb der Spanne, die die App vorgibt. Der Betrag hängt nur von Entfernung und Größe der Sendung ab (von S bis XXL).' },
        { q: 'Gibt es bei Senvia versteckte Gebühren?', a: 'Nein. Die App ist kostenlos, ohne Abo, ohne Kilo-Gebühr und ohne Abrechnung nach der Zustellung. Der Betrag steht vor der Bestätigung fest.' },
        { q: 'Wann wird der Transport bezahlt?', a: 'Die Zahlung läuft über die App, mit Apple Pay, Google Pay oder Karte, sobald sich Absender und Reisender einig sind. Es wird nicht vor Ort bezahlt und bei der Übergabe nicht verhandelt.' },
        { q: 'Bekomme ich Geld zurück, wenn der Transport abgesagt wird?', a: 'Sagt der Reisende vor der Übergabe ab, kannst du einen anderen finden oder eine Erstattung anfordern. Schreib an contact@senviaapp.com, wir klären das.' }
      ] },
      { title: 'Sicherheit', items: [
        { q: 'Ist der Versand mit Senvia sicher?', a: 'Vor der Zusage kannst du Profil, Bewertungen, Rezensionen und Aktivitätsverlauf eines Nutzers ansehen. Die Kommunikation bleibt in der App, und nach jeder abgeschlossenen Zustellung bewerten sich beide Seiten gegenseitig.' },
        { q: 'Wie funktioniert die Nutzerverifizierung?', a: 'Jedes neue Konto wird vor der ersten Sendung freigegeben. Zusätzlich zeigt das Profil die Durchschnittsbewertung, Rezensionen anderer Nutzer und die Zahl abgeschlossener Fahrten, du kannst also einschätzen, mit wem du dich einlässt.' },
        { q: 'Was passiert, wenn etwas schiefgeht?', a: 'Schreib an contact@senviaapp.com, wir helfen bei der Kommunikation zwischen Absender und Reisendem. Bewertungen und Rezensionen bleiben öffentlich sichtbar, das Verhalten eines Nutzers sehen also auch andere.' },
        { q: 'Muss ich jede Anfrage oder jedes Angebot annehmen?', a: 'Nein. Nichts ist verpflichtend. Passen Profil, Inhalt, Kostenbeitrag oder Termin nicht, bestätigst du einfach nicht. Ohne Begründung, ohne Strafe und ohne Auswirkung auf deine Bewertung.' },
        { q: 'Was, wenn die Sachen nicht fotografiert sind?', a: 'Du musst den Transport nicht annehmen. Das Foto ist die Art, wie ein Reisender weiss, was er transportiert, und ein Absender einen Nachweis über den Zustand vor der Fahrt hat.' },
        { q: 'Kann ich einen Nutzer melden?', a: 'Ja, über die App oder an contact@senviaapp.com. Der Support ist jeden Tag erreichbar, und Bewertungen bleiben öffentlich, das Verhalten ist also vor jeder neuen Absprache sichtbar.' },
        { q: 'Wie sind meine persönlichen Daten geschützt?', a: 'Telefonnummer und E-Mail-Adresse teilst du nicht mit der anderen Seite, alles läuft über den Chat in der App. Dein Konto und alle zugehörigen Daten kannst du jederzeit dauerhaft in der App löschen.' }
      ] }
    ]
  };

  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18n = m;
      this.setState({ lang: m.getLang() });
      this.off = m.onLang(l => this.setState({ lang: l }));
    });
  }
  componentWillUnmount() { if (this.off) this.off(); }

  // Sinkronizacija zaglavlja radi iz renderVals jer se komponenta uvijek iznova
  // iscrtava pri promjeni jezika; naslov se ponovno upisuje i nakon iscrtavanja
  // jer ga runtime vraća na vrijednost iz helmeta.
  syncSeo() {
    const lang = this.state.lang;
    if (this.seoLang === lang) { this.reassertTitle(lang); return; }
    this.seoLang = lang;
    this.applySeo();
    this.reassertTitle(lang);
  }
  reassertTitle(lang) {
    const t = this.STR[lang] || this.STR.hr;
    if (this.titleTimer) clearTimeout(this.titleTimer);
    this.titleTimer = setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 60);
    setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 400);
  }

  head(sel, make) {
    let el = document.head.querySelector(sel);
    if (!el) { el = make(); document.head.appendChild(el); }
    return el;
  }

  applySeo() {
    const lang = this.state.lang;
    const t = this.STR[lang] || this.STR.hr;
    document.title = t.title;
    document.documentElement.setAttribute('lang', lang);
    const meta = (attr, name, content) => {
      const el = this.head('meta[' + attr + '="' + name + '"]', () => {
        const m = document.createElement('meta'); m.setAttribute(attr, name); return m;
      });
      el.setAttribute('content', content);
    };
    meta('name', 'description', t.desc);
    meta('property', 'og:title', t.title);
    meta('property', 'og:description', t.desc);
    meta('property', 'og:locale', t.locale);

    const groups = this.GROUPS[lang] || this.GROUPS.hr;
    const items = groups.reduce((all, g) => all.concat(g.items), []);
    const ld = this.head('script#senvia-faq-ld', () => {
      const s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'senvia-faq-ld'; return s;
    });
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'FAQPage',
      mainEntity: items.map(f => ({ '@type': 'Question', name: f.q, acceptedAnswer: { '@type': 'Answer', text: f.a } }))
    });

    const bc = this.head('script#senvia-breadcrumb-ld', () => {
      const s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'senvia-breadcrumb-ld'; return s;
    });
    bc.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Senvia', item: 'https://www.senviaapp.com/' },
        { '@type': 'ListItem', position: 2, name: t.crumb, item: 'https://www.senviaapp.com/faq/' }
      ]
    });
  }

  renderVals() {
    this.syncSeo();
    return {
      t: { ...this.STR.hr, ...(this.STR[this.state.lang] || {}) },
      groups: this.GROUPS[this.state.lang] || this.GROUPS.hr
    };
  }
}
