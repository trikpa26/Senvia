<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'hr' };

  STR = {
    hr: {
      h1: 'Ova stranica je otputovala bez nas',
      lead: 'Adresa ne postoji ili je stranica uklonjena. Rute bez aktivnih putnika povlačimo automatski, pa je moguće da si došao na jednu od njih.',
      lHome: 'Početna', lSend: 'Slanje stvari', lHow: 'Kako radi',
      title: 'Stranica nije pronađena | Senvia'
    },
    en: {
      h1: 'This page travelled on without us',
      lead: 'The address does not exist or the page has been removed. Routes without active travellers are taken down automatically, so you may have landed on one of those.',
      lHome: 'Home', lSend: 'Sending items', lHow: 'How it works',
      title: 'Page not found | Senvia'
    },
    de: {
      h1: 'Diese Seite ist ohne uns weitergefahren',
      lead: 'Die Adresse gibt es nicht oder die Seite wurde entfernt. Strecken ohne aktive Reisende nehmen wir automatisch offline, vielleicht bist du auf einer davon gelandet.',
      lHome: 'Startseite', lSend: 'Sachen senden', lHow: 'So funktioniert es',
      title: 'Seite nicht gefunden | Senvia'
    }
  };

  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18n = m;
      this.setState({ lang: m.getLang() });
      this.off = m.onLang(l => this.setState({ lang: l }));
    });
  }
  componentWillUnmount() { if (this.off) this.off(); }

  renderVals() {
    const t = { ...this.STR.hr, ...(this.STR[this.state.lang] || {}) };
    document.documentElement.setAttribute('lang', this.state.lang);
    if (this.titleTimer) clearTimeout(this.titleTimer);
    this.titleTimer = setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 60);
    return { t };
  }
}
</script>
