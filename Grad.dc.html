<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    button, input, select, textarea { font-family: inherit; }
    body { margin: 0; font-family: 'Outfit', sans-serif; color: #12261a; background: #faf9f6; -webkit-font-smoothing: antialiased; }
    a { color: #1a9e44; text-decoration: none; }
    a:hover { color: #0e7c31; }
    ::selection { background: #c9efd6; }
    img { max-width: 100%; }
  </style>
</helmet>

<div style="overflow-x: clip">

<dc-import name="Nav" style="position: sticky; top: 0; z-index: 100" active="" hint-size="100%,66px"></dc-import>

<nav aria-label="breadcrumb" style="max-width: 1360px; margin: 0 auto; padding: 18px clamp(16px, 4.0vw, 32px) 0; font-size: 13.5px; color: #6b8272; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
  <a href="Senvia%20Landing%20v3.dc.html" style="color: #6b8272">Senvia</a>
  <span>/</span>
  <a href="Popularne%20rute.dc.html" style="color: #6b8272">{{ crumbRoutes }}</a>
  <span>/</span>
  <span style="color: #12261a; font-weight: 600">{{ cityName }}</span>
</nav>

<section style="max-width: 1360px; margin: 0 auto; padding: 32px clamp(16px, 4.0vw, 32px) clamp(29px, 4.9vw, 56px)">
  <div style="max-width: 860px">
    <h1 style="font-family: 'Outfit', sans-serif; font-size: clamp(32px, 9.0vw, 56px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 22px; text-wrap: balance">{{ h1 }}</h1>
    <p style="font-size: 20px; line-height: 1.6; color: #3c5346; margin: 0 0 18px; max-width: 60ch; text-wrap: pretty">{{ intro }}</p>
    <p style="font-size: 17px; line-height: 1.65; color: #3c5346; margin: 0 0 32px; max-width: 62ch; text-wrap: pretty">{{ spot }}</p>
    <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap">
      <a href="https://apps.apple.com/app/id6759839112" target="_blank" rel="noopener noreferrer" style="display: inline-block; transition: transform .2s ease" style-hover="transform: translateY(-2px)"><img src="assets/app-store-badge.webp" alt="Download on the App Store" height="52" style="display: block; border-radius: 10px"></a>
      <a href="https://play.google.com/store/apps/details?id=com.senviaapp.senvia" target="_blank" rel="noopener noreferrer" style="display: inline-block; transition: transform .2s ease" style-hover="transform: translateY(-2px)"><img src="assets/google-play-badge.png" alt="Get it on Google Play" height="52" style="display: block; border-radius: 10px"></a>
    </div>
  </div>
</section>

<section style="background: #f2f0ea; border-top: 1px solid #e9e6dd; border-bottom: 1px solid #e9e6dd">
  <div style="max-width: 1360px; margin: 0 auto; padding: clamp(34px, 5vw, 60px) clamp(16px, 4.0vw, 32px)">
    <h2 style="font-family: 'Outfit', sans-serif; font-size: clamp(22px, 4.6vw, 30px); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 8px">{{ routesTitle }}</h2>
    <p style="margin: 0 0 24px; font-size: 15.5px; color: #3c5346; max-width: 70ch; text-wrap: pretty">{{ routesNote }}</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px">
      <sc-for list="{{ routes }}" as="r" hint-placeholder-count="9">
        <a href="{{ r.href }}" style="display: flex; flex-direction: column; gap: 6px; background: #ffffff; border: 1px solid #e6e3da; border-radius: 18px; padding: 18px 20px; color: #12261a" style-hover="border-color: #2dbb54">
          <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 18px">{{ r.title }}</span>
          <span style="font-size: 14.5px; color: #3c5346">{{ r.time }}</span>
          <span style="font-size: 14.5px; color: #167a38; font-weight: 600">{{ r.price }}</span>
        </a>
      </sc-for>
    </div>
  </div>
</section>

<section style="max-width: 1360px; margin: 0 auto; padding: clamp(38px, 6vw, 76px) clamp(16px, 4.0vw, 32px) 0">
  <h2 style="font-family: 'Outfit', sans-serif; font-size: clamp(22px, 4.6vw, 30px); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 22px">{{ faqTitle }}</h2>
  <div style="display: grid; gap: 12px; max-width: 900px">
    <sc-for list="{{ faq }}" as="f" hint-placeholder-count="3">
      <div style="border: 1px solid #e6e3da; border-radius: 18px; padding: 22px 24px; background: #ffffff">
        <h3 style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; margin: 0 0 8px">{{ f.q }}</h3>
        <p style="margin: 0; font-size: 16px; line-height: 1.65; color: #3c5346; text-wrap: pretty">{{ f.a }}</p>
      </div>
    </sc-for>
  </div>
</section>

<section style="max-width: 1360px; margin: 0 auto; padding: clamp(38px, 6.5vw, 84px) clamp(16px, 4.0vw, 32px)">
  <div style="background: #2dbb54; border-radius: 28px; padding: clamp(29px, 4.9vw, 64px) clamp(24px, 6.0vw, 48px); text-align: center; color: #ffffff">
    <img src="assets/senvia-logo.png" alt="Senvia logo" width="60" height="60" style="border-radius: 15px; box-shadow: 0 10px 26px rgba(10,60,26,0.3); margin-bottom: 24px">
    <h2 style="font-family: 'Outfit', sans-serif; font-size: clamp(21px, 5.8vw, 36px); font-weight: 700; letter-spacing: -0.015em; margin: 0 0 14px; text-wrap: balance">{{ ctaTitle }}</h2>
    <p style="margin: 0 auto 32px; font-size: 18px; line-height: 1.55; max-width: 48ch; color: #ffffff; text-wrap: pretty">{{ ctaSub }}</p>
    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap">
      <a href="https://apps.apple.com/app/id6759839112" target="_blank" rel="noopener noreferrer"><img src="assets/app-store-badge.webp" alt="Download on the App Store" height="54" style="display: block; border-radius: 10px"></a>
      <a href="https://play.google.com/store/apps/details?id=com.senviaapp.senvia" target="_blank" rel="noopener noreferrer"><img src="assets/google-play-badge.png" alt="Get it on Google Play" height="54" style="display: block; border-radius: 10px"></a>
    </div>
  </div>
</section>

<section style="max-width: 1360px; margin: 0 auto; padding: 0 clamp(16px, 4.0vw, 32px) clamp(38px, 6.5vw, 84px)">
  <h2 style="font-family: 'Outfit', sans-serif; font-size: clamp(20px, 4.2vw, 26px); font-weight: 700; margin: 0 0 18px">{{ otherTitle }}</h2>
  <div style="display: flex; gap: 10px; flex-wrap: wrap">
    <sc-for list="{{ others }}" as="o" hint-placeholder-count="7">
      <a href="{{ o.href }}" style="display: inline-flex; border: 1px solid #e6e3da; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; color: #12261a; background: #ffffff" style-hover="border-color: #2dbb54; color: #167a38">{{ o.name }}</a>
    </sc-for>
  </div>
</section>

<dc-import name="Podnozje" hint-size="100%,300px"></dc-import>

</div>
</x-dc>

  city(key, lang) { const c = this.C[key] || {}; return c[lang] || c.hr || key; }
  fill(s, v) { return String(s).replace(/\{(\w+)\}/g, (_, k) => v[k] != null ? v[k] : ''); }
  key() { return this.CITIES[this.props.slug] ? this.props.slug : 'bec'; }
  data() {
    const lang = this.state.lang, key = this.key();
    const t = { ...this.STR.hr, ...(this.STR[lang] || {}) };
    const c = this.CITIES[key][lang] || this.CITIES[key].hr;
    const all = [].concat(this.ROUTES.at, this.ROUTES.de, this.ROUTES.ch, this.ROUTES.hr);
    const seen = {};
    const list = all.filter(r => r[0] === key || r[1] === key).map(([a, b, h, km]) => {
      const other = a === key ? b : a;
      return { other, h, km };
    }).filter(r => { if (seen[r.other]) return false; seen[r.other] = true; return true; }).slice(0, 24);
    const slugFor = (o) => [key + '-' + o, o + '-' + key].find(x => this.SLUGS.indexOf(x) > -1);
    const name = this.city(key, lang);
    const routes = list.map(r => {
      const sl = slugFor(r.other);
      return { title: name + ' \u2013 ' + this.city(r.other, lang), time: r.km + ' km \u00b7 ' + r.h[0] + '\u2013' + r.h[1] + ' ' + t.h,

    });

    return { t, c, name, routes, faq, v, key, lang };
  }

    const meta = (attr, n, val) => { let el = head.querySelector('meta[' + attr + '="' + n + '"]'); if (!el) { el = document.createElement('meta'); el.setAttribute(attr, n); head.appendChild(el); } el.setAttribute('content', val); };
