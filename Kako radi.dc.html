<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {

  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18n = m;
      this.setState({ lang: m.getLang() });
      this.off = m.onLang(l => this.setState({ lang: l }));
    });
    let bc = document.getElementById('senvia-breadcrumb-ld');
    if (!bc) { bc = document.createElement('script'); bc.type = 'application/ld+json'; bc.id = 'senvia-breadcrumb-ld'; document.head.appendChild(bc); }
    bc.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: "Početna", item: "https://www.senviaapp.com/" },
        { '@type': 'ListItem', position: 2, name: this.t().crumb, item: "https://www.senviaapp.com/kako-radi" }
      ]
    });
  }
  componentWillUnmount() { if (this.off) this.off(); }

  syncSeo() {
    const lang = this.state.lang;
    const t = this.t();
    if (this.seoLang !== lang) {
      this.seoLang = lang;
      document.documentElement.setAttribute('lang', lang);
      const meta = (attr, name, content) => {
        let el = document.head.querySelector('meta[' + attr + '="' + name + '"]');
        if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
        el.setAttribute('content', content);
      };
      meta('name', 'description', t.desc);
      meta('property', 'og:title', t.title);
      meta('property', 'og:description', t.desc);
      meta('property', 'og:locale', t.locale);
      const bc = document.getElementById('senvia-breadcrumb-ld');
      if (bc) bc.textContent = JSON.stringify({
        '@context': 'https://schema.org', '@type': 'BreadcrumbList',
        itemListElement: [
          { '@type': 'ListItem', position: 1, name: 'Senvia', item: 'https://www.senviaapp.com/' },
          { '@type': 'ListItem', position: 2, name: t.crumb, item: 'https://www.senviaapp.com/kako-radi' }
        ]
      });
    }
    if (this.titleTimer) clearTimeout(this.titleTimer);
    this.titleTimer = setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 60);
    setTimeout(() => { if (document.title !== t.title) document.title = t.title; }, 400);
  }

  state = { step: 0, lang: 'hr' };

  STR = {
    hr: {
      crumb: 'Kako radi', kicker: 'Kako radi',
      h1: 'Kako funkcionira Senvia',
      lead: 'Senvia spaja pošiljatelje s putnicima koji već putuju istim smjerom. Cijeli proces, od objave zahtjeva do recenzije, odvija se unutar aplikacije. Isti koraci vrijede i kad šalješ paket i kad ga prevoziš, razlika je samo u tome objavljuješ li zahtjev ili vožnju.',
      stepsTitle: 'Sve je gotovo u 5 koraka',
      ctaTitle: 'Preuzmi aplikaciju besplatno',
      ctaText: 'Objavi prvi zahtjev ili prvu vožnju u nekoliko minuta. Bez pretplate.',
      title: 'Kako funkcionira Senvia, slanje paketa uz putnika | Senvia',
      desc: 'Pošalji paket u 5 koraka. Senvia spaja pošiljatelje s putnicima koji već putuju istim smjerom. Besplatno i bez pretplate.',
      locale: 'hr_HR',
      s1t: 'Pronađi vožnju ili zahtjev za prijevozom', s1d: 'Pretraži objavljene vožnje i zahtjeve za prijevozom te odaberi ono što odgovara tvojoj ruti.',
      s2t: 'Objavi svoj zahtjev', s2d: 'Ako ništa ne odgovara, objavi zahtjev za slanje paketa ili planiranu vožnju. Dodaj lokacije, datum, fotografiju i detalje paketa.',
      s3t: 'Provjeri profil korisnika', s3d: 'Prije dogovora pogledaj profil s detaljima: ocjene, recenzije i dosadašnje vožnje.',
      s4t: 'Dogovori sve u chatu', s4d: 'Dogovorite detalje u chatu i ostanite povezani tijekom cijelog putovanja.',
      s5t: 'Ostavite recenziju', s5d: 'Nakon uspješno završene dostave, pošiljatelj i vozač ocjenjuju jedno drugo i ostavljaju recenziju.'
    },
    en: {
      crumb: 'How it works', kicker: 'How it works',
      h1: 'How Senvia works',
      lead: 'Senvia connects senders with travellers already going the same way. The whole process, from posting a request to leaving a review, happens inside the app. The same steps apply whether you are sending a package or carrying one, the only difference is whether you post a request or a ride.',
      stepsTitle: 'It is all done in 5 steps',
      ctaTitle: 'Download the app for free',
      ctaText: 'Post your first request or your first ride in a few minutes. No subscription.',
      title: 'How Senvia works, sending packages with a traveller | Senvia',
      desc: 'Send a package in 5 steps. Senvia connects senders with travellers already going the same way. Free and without a subscription.',
      locale: 'en_GB',
      s1t: 'Find a ride or a request', s1d: 'Browse posted rides and transport requests and pick the one that matches your route.',
      s2t: 'Post your own request', s2d: 'If nothing matches, post a request for a package or a planned ride. Add locations, date, a photo and the package details.',
      s3t: 'Check the other users profile', s3d: 'Before agreeing, look at the profile in detail: ratings, reviews and completed trips.',
      s4t: 'Agree everything in the chat', s4d: 'Agree the details in the chat and stay in touch for the whole journey.',
      s5t: 'Leave a review', s5d: 'After the delivery is completed, the sender and the driver rate each other and leave a review.'
    },
    de: {
      crumb: 'So funktioniert es', kicker: 'So funktioniert es',
      h1: 'So funktioniert Senvia',
      lead: 'Senvia verbindet Absender mit Reisenden, die ohnehin in dieselbe Richtung fahren. Der gesamte Ablauf, von der Anfrage bis zur Bewertung, findet in der App statt. Die Schritte sind gleich, ob du ein Paket sendest oder eines mitnimmst, der Unterschied ist nur, ob du eine Anfrage oder eine Fahrt einstellst.',
      stepsTitle: 'Alles erledigt in 5 Schritten',
      ctaTitle: 'App kostenlos herunterladen',
      ctaText: 'Stelle deine erste Anfrage oder erste Fahrt in wenigen Minuten ein. Ohne Abo.',
      title: 'So funktioniert Senvia, Pakete mit Reisenden senden | Senvia',
      desc: 'Sende ein Paket in 5 Schritten. Senvia verbindet Absender mit Reisenden, die ohnehin unterwegs sind. Kostenlos und ohne Abo.',
      locale: 'de_DE',
      s1t: 'Fahrt oder Anfrage finden', s1d: 'Sieh dir eingestellte Fahrten und Transportanfragen an und wähle, was zu deiner Strecke passt.',
      s2t: 'Eigene Anfrage einstellen', s2d: 'Passt nichts, stelle eine Anfrage für ein Paket oder eine geplante Fahrt ein. Ergänze Orte, Datum, ein Foto und die Paketdetails.',
      s3t: 'Profil des Nutzers prüfen', s3d: 'Sieh dir vor der Absprache das Profil im Detail an: Bewertungen, Rezensionen und bisherige Fahrten.',
      s4t: 'Alles im Chat vereinbaren', s4d: 'Klärt die Details im Chat und bleibt während der gesamten Fahrt in Kontakt.',
      s5t: 'Bewertung hinterlassen', s5d: 'Nach der abgeschlossenen Zustellung bewerten sich Absender und Fahrer gegenseitig und hinterlassen eine Rezension.'
    }
  };

  t() { return { ...this.STR.hr, ...(this.STR[this.state.lang] || {}) }; }
  list() {
    const t = this.t();
    return [1, 2, 3, 4, 5].map((n, i) => ({ title: t['s' + n + 't'], desc: t['s' + n + 'd'], img: i }));
  }

  renderVals() {
    this.syncSeo();
    const list = this.list();
    const activeImg = list[this.state.step] ? list[this.state.step].img : 0;

    const steps = list.map((s, i) => {
      const active = this.state.step === i;
      return {
        n: '0' + (i + 1), title: s.title, desc: s.desc,
        onClick: () => this.setState({ step: i }),
        rowStyle: {
          display: 'flex', gap: '18px', padding: '22px 24px', borderRadius: '20px', alignItems: 'flex-start', cursor: 'pointer',
          transition: 'all .3s ease',
          border: active ? '1px solid #e4efe7' : '1px solid transparent',
          background: active ? '#ffffff' : 'transparent',
          boxShadow: active ? '0 12px 32px rgba(18,38,26,0.09)' : 'none'
        },
        numStyle: {
          width: '40px', height: '40px', borderRadius: '13px', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: '14px', transition: 'all .3s ease',
          background: active ? '#2dbb54' : '#e8f7ee', color: active ? '#ffffff' : '#167a38'
        }
      };
    });

    const img = (n) => ({
      position: 'absolute', inset: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      opacity: n === activeImg ? 1 : 0,
      pointerEvents: n === activeImg ? 'auto' : 'none',
      transition: 'opacity .4s ease',
      background: n === 4 ? '#e8f2ea' : 'transparent',
      padding: n === 4 ?'20px' : '0',
      boxSizing: 'border-box'
    });

    return {
      t: this.t(),
      steps,
      img0: img(0), img1: img(1), img2: img(2), img3: img(3), img4: img(4)
    };
  }
}
</script>
</body>
